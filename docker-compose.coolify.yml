services:
  realtime:
    build:
      context: .
      dockerfile: mini-services/realtime/Dockerfile

    environment:
      NODE_ENV: production
      REALTIME_PORT: "3003"
      REALTIME_ADMIN_PORT: "3004"
      REALTIME_ADMIN_BIND: "0.0.0.0"
      REALTIME_SECRET: ${REALTIME_SECRET}
      REALTIME_ALLOWED_ORIGIN: ${APP_URL}

    expose:
      - "3003"
      - "3004"
    
    networks:
      - default
      - coolify

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}

      REALTIME_URL: http://realtime:3004
      REALTIME_SECRET: ${REALTIME_SECRET}
      REALTIME_PUBLIC_URL: ${REALTIME_PUBLIC_URL}

      APP_URL: ${APP_URL}
      MIGRATE_ON_START: "true"

    expose:
      - "3000"

    depends_on:
      realtime:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - default
      - coolify

networks:
  coolify:
    external: true